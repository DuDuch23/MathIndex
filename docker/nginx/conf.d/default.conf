# Standard Symfony front-controller pattern. Only /index.php is ever executed;
# every other *.php path is explicitly denied. This is the key mitigation
# against unrestricted upload turning into remote code execution: even if a
# script ever ended up under public/fichier/, nginx will not execute it —
# only public/index.php is routed to PHP-FPM.
server {
    listen 8080;
    server_name _;

    root /app/public;

    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    # Any other *.php request (e.g. someone guessing a filename under an
    # upload directory) is rejected outright, never handed to PHP-FPM.
    location ~ \.php$ {
        return 404;
    }

    location ~ \.(?:jpg|jpeg|gif|png|webp|ico|css|js|svg|woff2?|ttf)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    error_log /dev/stderr warn;
    access_log /dev/stdout;
}
