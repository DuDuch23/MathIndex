; Applied in every environment (php_base). Environment-specific tuning lives in
; app_prod's Dockerfile ENV vars (opcache.validate_timestamps) and dev.ini.

; Don't advertise the PHP version in response headers.
expose_php = Off

; Uploads: keep in sync with the Assert\File(maxSize: '10M') constraint on
; App\Entity\File — give a little headroom for multipart overhead.
upload_max_filesize = 12M
post_max_size = 14M
max_file_uploads = 5

; Opcache: always on, tuned for a small-to-medium app.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
