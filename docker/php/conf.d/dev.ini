; app_dev only. Prod sets the inverse of these (see Dockerfile app_prod ENV +
; app.ini) for performance; dev trades that for live reload + error visibility.

opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

display_errors = On
error_reporting = E_ALL

; PHP ini only supports plain ${VAR} interpolation (no shell-style ":-default"
; fallback) — compose.override.yaml sets XDEBUG_MODE/XDEBUG_CLIENT_HOST with
; real defaults on the container's environment, so these are always defined.
xdebug.mode = ${XDEBUG_MODE}
xdebug.client_host = ${XDEBUG_CLIENT_HOST}
xdebug.start_with_request = yes
